name: smat_expense_tracker
description: A complete production-ready offline Android application for expense tracking with local AI.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State Management
  flutter_riverpod: ^2.3.6
  riverpod_annotation: ^2.1.1

  # Local Database & Storage
  sqflite: ^2.3.0
  path: ^1.8.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^8.0.0
  
  # UI & Styling
  fl_chart: ^0.63.0
  google_fonts: ^5.1.0
  flutter_animate: ^4.2.0
  glassmorphism: ^3.0.0
  intl: ^0.18.1
  font_awesome_flutter: ^10.4.0

  # Data Export
  pdf: ^3.10.4
  excel: ^2.1.0
  csv: ^5.0.2
  path_provider: ^2.1.1
  share_plus: ^7.1.0

  # Notifications & Auth
  flutter_local_notifications: ^15.1.1
  local_auth: ^2.1.6

  # Logic & Serialization
  json_annotation: ^4.8.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.2.3
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
